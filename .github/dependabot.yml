version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Packages that must be upgraded together are grouped for every update
    # type; a lone major bump in these sets cannot install.
    groups:
      vite:
        patterns: ['vite', '@vitejs/*', 'vite-plugin-*']
      eslint:
        patterns:
          ['eslint', '@eslint/*', 'eslint-plugin-*', 'typescript-eslint']
      mantine:
        patterns: ['@mantine/*', 'postcss-preset-mantine']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      three:
        patterns: ['three', '@types/three', '@react-three/*']
      # Remaining minor and patch updates are batched. Other majors surface as
      # their own PR so one incompatible package does not block the group.
      npm-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # typescript-eslint (even its canary channel) still requires
      # typescript <6.1.0, so a TS major update can't install right now.
      # Remove this once typescript-eslint supports newer TypeScript.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /community-api
    schedule:
      interval: weekly
    groups:
      community-api-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
