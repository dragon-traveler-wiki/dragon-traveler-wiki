version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # Safe to batch and merge together. Majors are deliberately excluded so
      # they surface as their own individual PR instead of riding along in
      # this bundle, where one incompatible package (e.g. a peer-dependency
      # conflict) would otherwise block every update in the group.
      npm-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # typescript-eslint (even its canary channel) still requires
      # typescript <6.1.0, so a TS major update can't install right now.
      # Remove this once typescript-eslint supports newer TypeScript.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /community-api
    schedule:
      interval: monthly
    groups:
      community-api-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
