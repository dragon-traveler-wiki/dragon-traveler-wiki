version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # Safe to batch and merge together. Majors are deliberately excluded so
      # they surface as their own individual PR instead of riding along in
      # this bundle, where one incompatible package (e.g. a peer-dependency
      # conflict) would otherwise block every update in the group.
      npm-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /community-api
    schedule:
      interval: monthly
    groups:
      community-api-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
