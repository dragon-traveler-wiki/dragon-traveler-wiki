name: Community API

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'community-api/**'
      - '.github/workflows/community-api.yml'
  pull_request:
    paths:
      - 'community-api/**'
      - '.github/workflows/community-api.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: community-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    # One deploy at a time (migrations and deploys must not overlap), and never
    # cancel one that is already running.
    concurrency:
      group: community-api-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: community-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply dragon-traveler-community --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test the live API
        # The custom domain can take a moment to answer after a deploy.
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors https://api.dtwiki.org/v1/health
