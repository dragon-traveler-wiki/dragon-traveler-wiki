name: Community API

on:
  push:
    branches: [main]
    paths:
      - 'community-api/**'
      - '.github/workflows/community-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'community-api/**'
      - '.github/workflows/community-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    concurrency:
      group: community-api-check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: community-api
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: community-api/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check Worker
        run: npm run check

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    # One deploy at a time (migrations and deploys must not overlap), and never
    # cancel one that is already running.
    concurrency:
      group: community-api-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: community-api
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: community-api/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply dragon-traveler-community --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test the live API
        # The custom domain can take a moment to answer after a deploy.
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors https://api.dtwiki.org/v1/health
