name: Process Issue Suggestion

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  process-suggestion:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, '[')
    concurrency:
      group: suggestion-process-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - name: Apply labels and check for duplicates
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.issue.title;
            const body = context.payload.issue.body ?? '';

            async function ensureLabel(labelName, color) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: labelName,
                    color,
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
            }

            async function closeAsDuplicate(originalIssueNumber, kind) {
              await github.rest.reactions.createForIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: originalIssueNumber,
                content: '+1',
              });
              await ensureLabel('duplicate', 'cfd3d7');
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['duplicate'],
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  `**This ${kind} is a duplicate.**`,
                  ``,
                  `An identical ${kind} already exists in #${originalIssueNumber}.`,
                  ``,
                  `This issue has been closed automatically. If you have additional context to add, please comment on the original issue.`,
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'not_planned',
              });
            }

            // ── Expired-code report ──────────────────────────────────────────
            if (title.startsWith('[Code] Report expired:')) {
              await ensureLabel('codes', 'e4e669');
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['codes'],
              });

              let duplicateNumber = null;
              let page = 1;
              outer: while (true) {
                const { data: issues } = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 100,
                  page,
                });
                for (const issue of issues) {
                  if (issue.number === context.issue.number) continue;
                  if (issue.title === title) {
                    duplicateNumber = issue.number;
                    break outer;
                  }
                }
                if (issues.length < 100) break;
                page++;
              }

              if (duplicateNumber) {
                await closeAsDuplicate(duplicateNumber, 'report');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: [
                    `**Thanks for the report!**`,
                    ``,
                    `This code has been flagged as expired and will be reviewed by a maintainer.`,
                  ].join('\n'),
                });
              }
              return;
            }

            // ── Suggestion issue ─────────────────────────────────────────────
            const match = title.match(/^\[([^\]]+)\]/);
            if (!match) return;

            const entityLabel = match[1].toLowerCase();
            const labels = ['suggestion', entityLabel];

            for (const labelName of labels) {
              await ensureLabel(
                labelName,
                labelName === 'suggestion' ? '0e8a16' : '5319e7'
              );
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels,
            });

            // Extract JSON from a SuggestModal-generated issue body and
            // normalize it (sorted keys, deterministic) for comparison.
            function extractNormalizedJson(issueBody) {
              const jsonMatch = issueBody?.match(/```json\n([\s\S]*?)\n```/);
              if (!jsonMatch) return null;
              try {
                const parsed = JSON.parse(jsonMatch[1]);
                return JSON.stringify(sortKeys(parsed));
              } catch {
                return null;
              }
            }

            function sortKeys(value) {
              if (Array.isArray(value)) return value.map(sortKeys);
              if (value !== null && typeof value === 'object') {
                return Object.fromEntries(
                  Object.entries(value)
                    .sort(([a], [b]) => a.localeCompare(b))
                    .map(([k, v]) => [k, sortKeys(v)])
                );
              }
              return value;
            }

            const newJson = extractNormalizedJson(body);

            // Search for an existing open suggestion with the same title and
            // identical JSON. Only check when the new issue has parseable JSON
            // (i.e. was submitted via SuggestModal).
            let duplicateOf = null;
            if (newJson !== null) {
              let page = 1;
              outer: while (true) {
                const { data: existingIssues } = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  labels: 'suggestion',
                  per_page: 100,
                  page,
                });

                for (const issue of existingIssues) {
                  if (issue.number === context.issue.number) continue;
                  if (issue.title !== title) continue;
                  const existingJson = extractNormalizedJson(issue.body ?? '');
                  if (existingJson !== null && existingJson === newJson) {
                    duplicateOf = issue;
                    break outer;
                  }
                }

                if (existingIssues.length < 100) break;
                page++;
              }
            }

            if (duplicateOf) {
              await closeAsDuplicate(duplicateOf.number, 'suggestion');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  `**Thanks for your suggestion!**`,
                  ``,
                  `Your issue has been labeled and will be reviewed by a maintainer.`,
                ].join('\n'),
              });
            }
