name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [data-updated]
  workflow_dispatch:
    inputs:
      data_branch:
        description: Branch of dragon-traveler-data to fetch
        default: main
        required: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check frontend quality
        run: npm run check

  build-and-deploy:
    needs: quality
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Checkout private data repo
        uses: actions/checkout@v7
        with:
          repository: dragon-traveler-wiki/dragon-traveler-data
          token: ${{ secrets.PAT }}
          ref: ${{ github.event.inputs.data_branch || 'main' }}
          path: private-data

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate production configuration
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          test -n "$R2_PUBLIC_URL"
          test -n "$API_BASE_URL"
          test -n "$TURNSTILE_SITE_KEY"
          case "$R2_PUBLIC_URL" in https://*) ;; *) exit 1 ;; esac
          case "$API_BASE_URL" in https://*) ;; *) exit 1 ;; esac

      - name: Build
        run: npm run build --ignore-scripts
        env:
          DATA_DIR: private-data/data
          ASSETS_DIR: private-data/assets
          VITE_APP_BASE: /
          VITE_ASSETS_BASE: ${{ vars.R2_PUBLIC_URL }}
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Copy data into dist
        run: cp -r private-data/data dist/data

      - name: Copy asset manifest into dist
        run: cp private-data/assets/manifest.json dist/assets/manifest.json

      - name: Validate Pages artifact
        env:
          EXPECTED_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run validate:pages

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
